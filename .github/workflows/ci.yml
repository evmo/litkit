# The three repositories that depend on litkit lock it by git ref, so a break
# here reaches them the moment one of them bumps. Every supported interpreter
# runs the suite; the build job proves the packaged wheel still carries
# common.mk, which is the one file a consumer gets at by path.
#
# Every `uses:` is pinned to a commit SHA, with the release it was at in the
# comment beside it. A tag is mutable — the owner can repoint `v4` at any
# commit, which is the mechanism behind the action-supply-chain compromises,
# and nothing in the run would look different. Bump these deliberately:
# read the diff between the pinned SHA and the new one, then move the pin.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262    # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      # The extras are what the archive and S3 paths need; the core is
      # stdlib-only and the suite covers it either way.
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} python -m unittest discover -s tests -v
      - run: uv run --python ${{ matrix.python }} python -m compileall -q litkit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262    # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      # `uvx ruff` resolves a Ruff release of its own, so CI would lint with a
      # version `uv.lock` has never seen. `uv run --locked` runs the pinned one
      # and fails if the lockfile has drifted from pyproject.toml.
      - run: uv run --locked ruff check litkit tests
      - run: uv lock --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262    # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - run: uv build
      - name: the wheel must carry common.mk and py.typed
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'litkit/data/common.mk'
          python -m zipfile -l dist/*.whl | grep -q 'litkit/py.typed'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
