[project]
name = "litkit"
version = "0.1.0"
description = "Shared plumbing for literate-analysis repositories: artifact sync and a common make interface"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Evan Morrison", email = "emorrison@gmail.com" }]
keywords = ["quarto", "reproducible-research", "data-sync", "s3", "r2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Archiving :: Mirroring",
  "Typing :: Typed",
]

# The core is stdlib-only on purpose: a repo whose inputs are published files
# behind a URL (the `fetch` kind, and reading a public mirror) should not have
# to carry boto3 into its lockfile. The heavier paths declare themselves.
dependencies = []

[project.optional-dependencies]
# Writing to the bucket, and reading from a private one.
s3 = ["boto3>=1.34"]
# The `archive` kind — tar.zst bundles for trees of many small files.
archive = ["zstandard>=0.22"]
all = ["boto3>=1.34", "zstandard>=0.22"]

[project.urls]
Homepage = "https://github.com/evmo/litkit"
Source = "https://github.com/evmo/litkit"
Issues = "https://github.com/evmo/litkit/issues"
Changelog = "https://github.com/evmo/litkit/blob/main/CHANGELOG.md"

[project.scripts]
litkit = "litkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["litkit"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4", "SIM", "BLE", "RUF"]
# tar-over-zstd-over-file is three layers of stream wrapping; nesting the
# `with`s is how it reads, not an oversight.
ignore = ["SIM117"]
